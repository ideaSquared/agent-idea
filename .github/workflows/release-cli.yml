name: Release idea CLI

# Tags main as v<version> and publishes a GitHub Release with generated notes, whenever package.json has a version that
# has no release yet. Users install the CLI from GitHub (`pnpm add -g github:ideaSquared/agent-idea#v<version>` pins
# one). To release: bump `version` in package.json in a PR and merge it.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read

# A release is never cut off half way, and two never run at once.
concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The job pushes the tag, so the token stays in the checkout; fetch-tags finds the previous release.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-tags: true
      - name: Tag and release this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json version '$version' is not X.Y.Z"
            exit 1
          fi
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released."
            exit 0
          fi
          previous=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A tag left by an earlier failed run is reused, so a re-run finishes the release.
          if ! git rev-parse --quiet --verify "refs/tags/$tag" >/dev/null; then
            git tag --annotate "$tag" --message "idea $version" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          gh release create "$tag" --verify-tag --title "idea $version" --generate-notes ${previous:+--notes-start-tag "$previous"}
