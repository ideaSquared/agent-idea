name: Release @ideasquared/ops

# Publishes packages/ops as a tarball on a GitHub Release tagged ops-v<version>, whenever main has a version that
# has no release yet. Products install it from that URL, so no package registry and no git subfolder (which
# `turbo prune` mishandles) are involved. To release: bump packages/ops/package.json's version and merge.
on:
  push:
    branches: [main]
    paths: ['packages/ops/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Release tag for this version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ops-v$(node -p "require('./packages/ops/package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Pack
        if: steps.version.outputs.exists == 'false'
        run: |
          pnpm -C packages/ops build
          git diff --exit-code -- packages/ops/dist || { echo "::error::packages/ops/dist is out of date"; exit 1; }
          pnpm -C packages/ops pack --pack-destination "$RUNNER_TEMP"
      - name: Publish the release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP"/ideasquared-ops-*.tgz --target "$GITHUB_SHA" \
            --title "@ideasquared/ops ${TAG#ops-v}" \
            --notes "Install: pnpm add https://github.com/${{ github.repository }}/releases/download/$TAG/$(basename "$RUNNER_TEMP"/ideasquared-ops-*.tgz)"
