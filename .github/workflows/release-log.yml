name: Release @ideasquared/log

# Publishes packages/log as a tarball on a GitHub Release tagged log-v<version>, whenever main has a version that
# has no release yet. Products install it from that URL, so no package registry and no git subfolder (which
# `turbo prune` mishandles) are involved. To release: bump packages/log/package.json's version and merge.
on:
  push:
    branches: [main]
    paths: ['packages/log/**']
  workflow_dispatch:

permissions:
  contents: read

# A release is never cut off half way, and two never run at once.
concurrency:
  group: release-log
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Release tag for this version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="log-v$(node -p "require('./packages/log/package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Pack
        if: steps.version.outputs.exists == 'false'
        run: |
          pnpm -C packages/log build
          stale=$(git status --porcelain -- packages/log/dist)
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error::packages/log/dist is out of date"
            exit 1
          fi
          pnpm -C packages/log pack --pack-destination "$RUNNER_TEMP"
      - name: Publish the release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP"/ideasquared-log-*.tgz --target "$GITHUB_SHA" \
            --title "@ideasquared/log ${TAG#log-v}" \
            --notes "Install: pnpm add https://github.com/${{ github.repository }}/releases/download/$TAG/$(basename "$RUNNER_TEMP"/ideasquared-log-*.tgz)"
