# Dependabot keeps the npm dependencies (it reads pnpm lockfiles) and the GitHub Actions current, including
# the pinned ideaSquared/shipper commit in the deploy workflow.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/London
    commit-message:
      prefix: chore(deps)
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/London
    commit-message:
      prefix: chore(ci)
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
